// 单仓多模块：主库 gc-primitives 单 jar 发布；example 与 benchmarks 为兄弟模块，不进发布物。
allprojects {
    group = 'net.de5.rainbowcrrsys'
    version = '0.2.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        // 以 Java 11 为基线编译，不使用更高版本的 API
        options.release = 11
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
    }
}
