name: Zig CI

# Zig 无 GC、无隐式分配；std.testing.allocator 会在每个 test 结束时检查泄漏。
on:
  push:
    branches:
      - main
    paths:
      - 'zig/**'
      - '.github/workflows/zig-ci.yml'
  pull_request:
    paths:
      - 'zig/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Zig 0.14.0 (tests + leak detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig 0.14.0
        uses: mlugg/setup-zig@v1
        with:
          version: '0.14.0'

      - name: Zig version
        run: zig version

      # `zig test` 编译并运行文件内所有 test 块，不依赖 build.zig / zon。
      - name: Contract tests (Debug, allocator leak check)
        working-directory: zig/gc-primitives
        run: |
          set +e
          zig test src/root.zig 2>&1 | tee /tmp/zig-debug.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=zig test (Debug) 完整输出::$(tr '\n' ' ' < /tmp/zig-debug.log | cut -c1-20000)"
            exit "$code"
          fi

      - name: Contract tests (ReleaseSafe)
        working-directory: zig/gc-primitives
        run: |
          set +e
          zig test -O ReleaseSafe src/root.zig 2>&1 | tee /tmp/zig-release.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=zig test (ReleaseSafe) 完整输出::$(tr '\n' ' ' < /tmp/zig-release.log | cut -c1-20000)"
            exit "$code"
          fi

      - name: zig build test
        working-directory: zig/gc-primitives
        run: |
          set +e
          zig build test 2>&1 | tee /tmp/zig-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=zig build test 完整输出::$(tr '\n' ' ' < /tmp/zig-build.log | cut -c1-20000)"
            exit "$code"
          fi
