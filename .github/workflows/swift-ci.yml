name: Swift CI

# SwiftPM 是零注册分发，但测试要在两套平台真实跑：Xcode Swift 与 Linux Swift。
on:
  push:
    branches:
      - main
    paths:
      - 'swift/**'
      - '.github/workflows/swift-ci.yml'
  pull_request:
    paths:
      - 'swift/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Xcode Swift)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Contract tests (XCTest)
        working-directory: swift/gc-primitives
        run: |
          set +e
          swift test 2>&1 | tee /tmp/swift-macos.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=swift test (macOS) 完整输出::$(tr '\n' ' ' < /tmp/swift-macos.log | cut -c1-20000)"
            exit "$code"
          fi

  linux:
    name: Ubuntu (Swift 5.9 官方容器)
    runs-on: ubuntu-24.04
    # 不依赖 runner 预装 Swift，也不依赖 setup-swift 对新 Ubuntu 的适配
    container: swift:5.9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Contract tests (XCTest)
        working-directory: swift/gc-primitives
        run: |
          set +e
          swift test 2>&1 | tee /tmp/swift-linux.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=swift test (Linux) 完整输出::$(tr '\n' ' ' < /tmp/swift-linux.log | cut -c1-20000)"
            exit "$code"
          fi
