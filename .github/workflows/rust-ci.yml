name: Rust CI

# Rust 版在真实工具链上验证：MSRV 1.70 与 stable 两套，测试 / doctest / clippy / fmt 全跑。
on:
  push:
    # tag push 不触发本工作流（paths 过滤对 tag push 不生效，必须用 branches 限定）
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV 1.70 (tests + doctests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.70
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.70.0'

      - name: Print toolchain
        working-directory: rust/gc-primitives
        run: rustc --version && cargo --version

      - name: Unit + integration tests
        working-directory: rust/gc-primitives
        run: |
          set +e
          cargo test --all-targets > /tmp/rust-msrv.log 2>&1
          code=$?
          cat /tmp/rust-msrv.log
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=cargo test MSRV 1.70::$(tr '\n' ' ' < /tmp/rust-msrv.log | cut -c1-20000)"
            exit "$code"
          fi

      - name: Doctests
        working-directory: rust/gc-primitives
        run: cargo test --doc

  stable:
    name: stable (tests + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable with clippy & rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Full test suite
        working-directory: rust/gc-primitives
        run: |
          set +e
          cargo test > /tmp/rust-stable.log 2>&1
          code=$?
          cat /tmp/rust-stable.log
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=cargo test stable::$(tr '\n' ' ' < /tmp/rust-stable.log | cut -c1-20000)"
            exit "$code"
          fi

      - name: Clippy (warnings are errors)
        working-directory: rust/gc-primitives
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          code=$?
          cat /tmp/clippy.log
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=clippy::$(tr '\n' ' ' < /tmp/clippy.log | cut -c1-20000)"
            exit "$code"
          fi

      - name: rustfmt check
        working-directory: rust/gc-primitives
        run: |
          set +e
          cargo fmt -- --check > /tmp/rustfmt.log 2>&1
          code=$?
          cat /tmp/rustfmt.log
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=rustfmt diff::$(tr '\n' ' ' < /tmp/rustfmt.log | cut -c1-20000)"
            exit "$code"
          fi
