name: Go CI

# Go 版在真实工具链上验证：Go 1.21（声明的基线）与 stable 两套。
# 注意：paths 过滤对 tag push 不生效，必须用 branches 限定，避免发版 tag 误触发。
on:
  push:
    branches:
      - main
    paths:
      - 'go/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    paths:
      - 'go/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go121:
    name: Go 1.21 (tests -race + vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Print toolchain
        working-directory: go/gc-primitives
        run: go version

      - name: Tests with race detector
        working-directory: go/gc-primitives
        run: go test -race ./...

      - name: go vet
        working-directory: go/gc-primitives
        run: go vet ./...

  stable:
    name: stable (tests + gofmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up stable Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Full test suite
        working-directory: go/gc-primitives
        run: go test ./...

      - name: go vet
        working-directory: go/gc-primitives
        run: go vet ./...

      - name: gofmt check
        working-directory: go/gc-primitives
        run: |
          if [ -z "$(gofmt -l .)" ]; then
            echo "gofmt OK"
          else
            gofmt -d . > /tmp/gofmt.diff 2>&1
            echo "::error title=gofmt diff::$(tr '\n' ' ' < /tmp/gofmt.diff | cut -c1-20000)"
            exit 1
          fi
