name: Publish Node to npm

# 监听 node-gc-primitives-v* tag。
# npm Trusted Publishing (OIDC) 只能给「已存在的包」配置，所以首发用一次性
# Granular Token（只存 Secret NPM_BOOTSTRAP_TOKEN，不进仓库文件）；包上架、
# 网页登记 Trusted Publisher 后删除该 Secret，即自动切到零凭据 OIDC。
on:
  push:
    tags:
      - 'node-gc-primitives-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    permissions:
      # OIDC 必需（npm >= 11.5.1 / Node >= 22.14）
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 官方 Trusted Publishing 模板要求写 registry-url；
          # 是否走 OIDC 取决于 NODE_AUTH_TOKEN 是否为空，而不是这一行。
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        working-directory: node/gc-primitives
        run: npm install -g npm@latest

      - name: Verify tag matches package.json
        working-directory: node/gc-primitives
        env:
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tag = process.env.TAG_NAME || '';
          const prefix = 'node-gc-primitives-v';
          if (process.env.EVENT_NAME === 'push' && tag.startsWith(prefix)) {
            const tv = tag.slice(prefix.length);
            if (tv !== v) {
              console.error(`tag ${tag} 与 package.json 版本 ${v} 不一致，拒绝发布`);
              process.exit(1);
            }
          }
          console.log('version OK:', v);
          JS

      - name: Install, typecheck, build, test
        working-directory: node/gc-primitives
        run: |
          npm install --global=false --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit
          npm run build
          npm test

      - name: Inspect package contents (dry run)
        working-directory: node/gc-primitives
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: node/gc-primitives
        env:
          # 首发阶段有值 -> token 鉴权；删除 Secret 后为空 -> unset -> OIDC
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          npm --version
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No bootstrap token: using npm Trusted Publishing (OIDC)"
            unset NODE_AUTH_TOKEN
          else
            echo "Bootstrap token present: first-publish mode"
          fi
          npm publish --access public
