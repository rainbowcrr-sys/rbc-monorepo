name: Publish Rust to crates.io

# tag 格式：gc-primitives__rust__v<版本>
# 用 crates.io Trusted Publishing（OIDC）换临时上传凭证，仓库里不放任何长期 API Token。
on:
  push:
    tags:
      - 'gc-primitives__rust__v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/gc-primitives
    permissions:
      # OIDC 必需；首发用一次性 Token，登记 Trusted Publishing 并删除该 Secret 后自动切换 OIDC
      id-token: write
    env:
      # 不能在 if 里直接引用 secrets，先映射到 job 级 env 做条件判断
      FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag version matches Cargo.toml
        env:
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          text = pathlib.Path('rust/gc-primitives/Cargo.toml').read_text(encoding='utf-8')
          version = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1)
          print('Cargo.toml version:', version)

          tag = os.environ.get('TAG_NAME', '')
          prefix = 'gc-primitives__rust__v'
          if os.environ.get('EVENT_NAME') == 'push' and tag.startswith(prefix):
              tag_version = tag[len(prefix):]
              print('tag version      :', tag_version)
              if tag_version != version:
                  raise SystemExit(f'tag {tag} 与 Cargo.toml 版本 {version} 不一致，拒绝发布')
          else:
              print('手动触发：跳过 tag 比对，使用 Cargo.toml 声明版本', version)
          PY

      - name: Run tests before publishing
        working-directory: rust/gc-primitives
        run: cargo test --all-targets

      # crates.io 的 Trusted Publishing 只能给「已存在的 crate」配置。
      # 首发阶段存在 CARGO_REGISTRY_TOKEN Secret，跳过 OIDC 直接用它；
      # 登记完 Trusted Publishing 并删除该 Secret 后，自动切换到 OIDC。
      - name: Exchange OIDC token for crates.io credential
        if: env.FALLBACK_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        working-directory: rust/gc-primitives
        env:
          # 优先 OIDC 临时凭证；首次发布时回退到 Secrets 里的一次性 Token
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error title=缺少发布凭证::OIDC 未配置且 Secret CARGO_REGISTRY_TOKEN 为空"
            exit 1
          fi
          echo "凭证已注入，长度 ${#CARGO_REGISTRY_TOKEN}（内容不打印）"
          set +e
          cargo publish 2>&1 | tee /tmp/cargo-publish.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            python3 - <<'PY'
          import pathlib
          t = pathlib.Path('/tmp/cargo-publish.log').read_text(encoding='utf-8', errors='replace')
          e = t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=cargo publish 完整输出::' + e[:60000])
          PY
            exit "$code"
          fi
