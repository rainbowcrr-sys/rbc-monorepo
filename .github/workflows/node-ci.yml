name: Node CI

# paths 过滤对 tag push 不生效，用 branches 限定，避免发版 tag 误触发。
on:
  push:
    branches:
      - main
    paths:
      - 'node/**'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'node/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} (build + contract tests + typecheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dev dependencies
        working-directory: node/gc-primitives
        run: npm install --global=false --no-audit --no-fund

      - name: Type check (no emit)
        working-directory: node/gc-primitives
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build ESM + .d.ts
        working-directory: node/gc-primitives
        run: npm run build

      # 测试直接 import dist/，验证的是真正会发布出去的产物
      - name: Contract tests (node:test)
        working-directory: node/gc-primitives
        run: npm test
