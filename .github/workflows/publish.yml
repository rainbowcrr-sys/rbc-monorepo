name: Publish to Maven Central

on:
  # tag 格式：gc-primitives__java__v<版本>
  # 库名带连字符，用双下划线分隔避免切分歧义；旧 tag java-v* 已退役。
  push:
    tags:
      - 'gc-primitives__java__v*'
  workflow_dispatch:
    inputs:
      publishing_type:
        description: 'AUTOMATIC 直接发布；USER_MANAGED 只上传，校验后到 Portal 手动点 Publish'
        required: false
        default: 'AUTOMATIC'
        type: choice
        options:
          - AUTOMATIC
          - USER_MANAGED

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Verify tag version matches Gradle metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          props = pathlib.Path('gradle.properties').read_text(encoding='utf-8')
          build = pathlib.Path('build.gradle').read_text(encoding='utf-8')
          p = re.search(r'^version=([^\s]+)', props, re.M).group(1)
          b = re.search(r"version\s*=\s*'([^']+)'", build).group(1)
          print('gradle.properties:', p)
          print('build.gradle     :', b)
          if p != b:
              raise SystemExit('两处 Gradle 版本不一致，拒绝发版')

          tag = os.environ.get('TAG_NAME', '')
          prefix = 'gc-primitives__java__v'
          if os.environ.get('EVENT_NAME') == 'push' and tag.startswith(prefix):
              tag_version = tag[len(prefix):]
              print('tag              :', tag_version)
              if tag_version != p:
                  raise SystemExit(f'tag {tag} 与 Gradle 版本 {p} 不一致，拒绝发布')
          else:
              print('手动触发：跳过 tag 比对，使用 Gradle 声明版本', p)
          PY

      - name: Build and test
        run: gradle :java:gc-primitives:test :java:example:build --no-daemon

      # 发布到本地 staging 目录，GPG 签名一并生成；再打成 deployment bundle
      - name: Stage signed artifacts and build bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set +e
          gradle :java:gc-primitives:bundleCentral --no-daemon --stacktrace > /tmp/gradle-bundle.log 2>&1
          code=$?
          cat /tmp/gradle-bundle.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=bundleCentral root cause::$(sed -n '/\* What went wrong:/,/\* Try:/p' /tmp/gradle-bundle.log | tr '\n' ' ' | head -c 6000)"
            echo "::error title=bundleCentral causes::$(grep -iE 'caused by|could not|pgp|signing|javadoc|error:|invalid' /tmp/gradle-bundle.log | tr '\n' ' ' | head -c 6000)"
            exit "$code"
          fi
          bundle=(java/gc-primitives/build/central-bundle/*-bundle.zip)
          files=$(unzip -Z1 "${bundle[0]}" | tr '\n' ' ')
          echo "::notice title=Bundle 文件清单::$files"

      # 凭据全部由 Secrets 注入；仓库内不含任何凭据明文
      - name: Upload to Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          bundle=(java/gc-primitives/build/central-bundle/*-bundle.zip)
          bash .github/scripts/upload-central.sh "${bundle[0]}" \
            "${{ github.event.inputs.publishing_type || 'AUTOMATIC' }}"
