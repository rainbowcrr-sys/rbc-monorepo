name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publishing_type:
        description: 'AUTOMATIC 直接发布；USER_MANAGED 只上传，校验后到 Portal 手动点 Publish'
        required: false
        default: 'AUTOMATIC'
        type: choice
        options:
          - AUTOMATIC
          - USER_MANAGED

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build and test
        run: gradle :gc-primitives:test :example:build --no-daemon

      # 发布到本地 staging 目录，GPG 签名一并生成；再打成 deployment bundle
      - name: Stage signed artifacts and build bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle :gc-primitives:bundleCentral --no-daemon
          bundle=(gc-primitives/build/central-bundle/*-bundle.zip)
          files=$(unzip -Z1 "${bundle[0]}" | tr '\n' ' ')
          echo "::notice title=Bundle 文件清单::$files"

      # 凭据全部由 Secrets 注入；仓库内不含任何凭据明文
      - name: Upload to Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          bundle=(gc-primitives/build/central-bundle/*-bundle.zip)
          bash .github/scripts/upload-central.sh "${bundle[0]}" \
            "${{ github.event.inputs.publishing_type || 'AUTOMATIC' }}"
