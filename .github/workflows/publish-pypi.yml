name: Publish Python to PyPI

# tag 格式：gc-primitives__python__v<版本>
# 项目目录为 python/gc-primitives/（顶层按语言、内层按项目）。
on:
  push:
    tags:
      - 'gc-primitives__python__v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 防止「tag 写新版本但包里还是旧版本」导致 PyPI 重复上传
      - name: Verify tag version matches package metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib

          base = pathlib.Path('python/gc-primitives')
          declared = tomllib.loads((base / 'pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          init = (base / 'gc_primitives/__init__.py').read_text(encoding='utf-8')
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init)
          init_version = m.group(1) if m else None

          print(f'pyproject.toml      : {declared}')
          print(f'__init__.py         : {init_version}')
          if declared != init_version:
              raise SystemExit('版本不一致：pyproject.toml 与 __init__.py 必须同步改')

          tag = os.environ.get('TAG_NAME', '')
          prefix = 'gc-primitives__python__v'
          if os.environ.get('EVENT_NAME') == 'push' and tag.startswith(prefix):
              tag_version = tag[len(prefix):]
              print(f'tag                : {tag_version}')
              if tag_version != declared:
                  raise SystemExit(f'tag {tag} 与包版本 {declared} 不一致，拒绝发布')
          else:
              print('手动触发：跳过 tag 比对，使用包内声明版本', declared)
          PY

      - name: Install build and check tools
        run: python -m pip install --upgrade build twine

      - name: Run contract tests
        run: python3 -m unittest discover -s python/gc-primitives/tests -v

      - name: Build wheel and sdist
        working-directory: python/gc-primitives
        run: python -m build

      - name: Check distributions render correctly
        working-directory: python/gc-primitives
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/gc-primitives/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # PyPI 侧的 Trusted Publisher 要填同样的 environment 名：pypi
    environment:
      name: pypi
      url: https://pypi.org/p/gc-primitives
    permissions:
      # Trusted Publishing 必需；不需要任何长期 API Token
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
