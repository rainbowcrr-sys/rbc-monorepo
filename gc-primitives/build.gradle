plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

description = 'Allocation-reducing object pooling primitives for the JVM'

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // 运行时零依赖；测试期才引入 JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'gc-primitives'
            pom {
                name = 'gc-primitives'
                description = 'Allocation-reducing object pooling primitives for the JVM'
                url = 'https://rainbowcrrsys.de5.net'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'rainbowcrr-sys'
                        name = 'rainbowcrr-sys'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/rainbowcrr-sys/rbc-monorepo.git'
                    developerConnection = 'scm:git:ssh://git@github.com/rainbowcrr-sys/rbc-monorepo.git'
                    url = 'https://github.com/rainbowcrr-sys/rbc-monorepo'
                }
            }
        }
    }
    // Central Portal 不提供标准 Maven 上传端点：先发布到本地目录，再打成 bundle 走 Publisher API。
    repositories {
        maven {
            name = 'centralStaging'
            url = layout.buildDirectory.dir('central-staging')
        }
    }
}

// 把本地 staging 仓库打成 Central Portal 的 deployment bundle（排除 maven-metadata）
tasks.register('bundleCentral', Zip) {
    group = 'publishing'
    description = '生成可上传 Central Portal 的 deployment bundle'
    dependsOn 'publishMavenJavaPublicationToCentralStagingRepository'
    from(layout.buildDirectory.dir('central-staging')) {
        exclude '**/maven-metadata.xml*'
    }
    archiveFileName = "gc-primitives-${project.version}-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('central-bundle')
}

signing {
    def signingKey = System.getenv('SIGNING_KEY')
    def signingPassword = System.getenv('SIGNING_PASSWORD')
    required { signingKey != null }
    if (signingKey != null) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}
